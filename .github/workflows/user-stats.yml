name: Generate GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *" # runs daily
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate user stats SVG
        uses: cicirello/user-statistician@v1
        with:
          image-file: .github/readme-stats/userstats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/readme-stats/userstats.svg
          git commit -m "Update GitHub profile stats" || echo "No changes"
          git push
